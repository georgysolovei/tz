version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tz-backend
    networks:
      - tz-network
    expose:
      - "8080"

  nginx:
    image: nginx:1.30.2-alpine
    container_name: tz-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tz-network
    ports:
      - "80:80"
    depends_on: 
      - backend

networks:
  tz-network:
    driver: bridge
    name: tz-network
